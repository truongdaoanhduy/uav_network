[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhang-xue-uav-algorithm-core"
version = "0.73.0"
description = "MATD3 and MASAC learner cores for the new seven-radio UAV scenario"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "torch>=2.3,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "PyYAML>=6,<7"]
gpu = ["warp-lang==1.18.0"]
plots = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["uav_network*"]
