name: UAV External Supervisor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect desired transitions without submitting Kaggle children
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: uav-external-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN_ACCOUNT_01: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_01 }}
      KAGGLE_API_TOKEN_ACCOUNT_17: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_17 }}
      KAGGLE_API_TOKEN_ACCOUNT_18: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_18 }}
      KAGGLE_API_TOKEN_ACCOUNT_19: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_19 }}
      KAGGLE_API_TOKEN_ACCOUNT_20: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_20 }}
      KAGGLE_API_TOKEN_ACCOUNT_21: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_21 }}
      KAGGLE_API_TOKEN_ACCOUNT_22: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_22 }}
      KAGGLE_API_TOKEN_ACCOUNT_23: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_23 }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
      WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      KAGGLE_ENABLED_ACCOUNTS: account_01,account_17,account_18,account_19,account_20,account_21,account_22,account_23
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout pinned supervisor source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/cpu-replay-20261022

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install orchestration-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle>=2.2,<3" "wandb>=0.25,<1" "huggingface-hub>=0.34,<2" "PyYAML>=6,<7"

      - name: Verify W&B and HF credential access (read only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: PYTHONPATH=. python -m uav_network.cloud.github_supervisor --check-services

      - name: Reconcile UAV lineages
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          PYTHONPATH=. python -m uav_network.cloud.github_supervisor --report outputs/supervisor-report.json "${args[@]}"

      - name: Preserve sanitized reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uav-supervisor-report
          path: outputs/supervisor-report.json
          if-no-files-found: ignore
          retention-days: 14
