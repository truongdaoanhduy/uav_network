name: UAV External Supervisor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect desired transitions without submitting Kaggle children
        required: false
        type: boolean
        default: false
      launch_masac_pql_replicate:
        description: Launch the pinned same-seed MASAC PQL reproducibility replicate on account_06
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: uav-external-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    if: github.event_name != 'workflow_dispatch' || !inputs.launch_masac_pql_replicate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN_ACCOUNT_01: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_01 }}
      KAGGLE_API_TOKEN_ACCOUNT_02: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_02 }}
      KAGGLE_API_TOKEN_ACCOUNT_03: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_03 }}
      KAGGLE_API_TOKEN_ACCOUNT_04: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_04 }}
      KAGGLE_API_TOKEN_ACCOUNT_05: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_05 }}
      KAGGLE_API_TOKEN_ACCOUNT_06: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_06 }}
      KAGGLE_API_TOKEN_ACCOUNT_07: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_07 }}
      KAGGLE_API_TOKEN_ACCOUNT_08: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_08 }}
      KAGGLE_API_TOKEN_ACCOUNT_09: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_09 }}
      KAGGLE_API_TOKEN_ACCOUNT_10: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_10 }}
      KAGGLE_API_TOKEN_ACCOUNT_11: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_11 }}
      KAGGLE_API_TOKEN_ACCOUNT_12: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_12 }}
      KAGGLE_API_TOKEN_ACCOUNT_13: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_13 }}
      KAGGLE_API_TOKEN_ACCOUNT_14: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_14 }}
      KAGGLE_API_TOKEN_ACCOUNT_15: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_15 }}
      KAGGLE_API_TOKEN_ACCOUNT_16: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_16 }}
      KAGGLE_API_TOKEN_ACCOUNT_17: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_17 }}
      KAGGLE_API_TOKEN_ACCOUNT_18: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_18 }}
      KAGGLE_API_TOKEN_ACCOUNT_19: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_19 }}
      KAGGLE_API_TOKEN_ACCOUNT_20: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_20 }}
      KAGGLE_API_TOKEN_ACCOUNT_21: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_21 }}
      KAGGLE_API_TOKEN_ACCOUNT_22: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_22 }}
      KAGGLE_API_TOKEN_ACCOUNT_23: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_23 }}
      KAGGLE_API_TOKEN_ACCOUNT_24: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_24 }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
      WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      KAGGLE_ENABLED_ACCOUNTS: ${{ vars.KAGGLE_ENABLED_ACCOUNTS }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout pinned supervisor source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/cpu-replay-20261022

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install orchestration-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "kaggle>=2.2,<3" "six>=1.16,<2" "wandb>=0.25,<1" "huggingface-hub>=0.34,<2" "PyYAML>=6,<7"

      - name: Verify W&B and HF credential access (read only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: PYTHONPATH=. python -m uav_network.cloud.github_supervisor --check-services

      - name: Reconcile UAV lineages
        shell: bash
        run: |
          args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          PYTHONPATH=. python -m uav_network.cloud.github_supervisor --report outputs/supervisor-report.json "${args[@]}"

      - name: Preserve sanitized reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uav-supervisor-report
          path: outputs/supervisor-report.json
          if-no-files-found: ignore
          retention-days: 14

  replicate:
    if: github.event_name == 'workflow_dispatch' && inputs.launch_masac_pql_replicate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KAGGLE_API_TOKEN_ACCOUNT_06: ${{ secrets.KAGGLE_API_TOKEN_ACCOUNT_06 }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
      WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout pinned scientific source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: 0ac776bd20f1abd472c0ed016bb9e3d95f7a95b4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install orchestration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=2.2,<3" "kaggle>=2.2,<3" "six>=1.16,<2" "wandb>=0.25,<1" "huggingface-hub>=0.34,<2" "PyYAML>=6,<7"

      - name: Launch exact MASAC PQL replicate on account_06
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          import os
          from pathlib import Path

          key_path = Path("/tmp/uav-replicate-key.json")
          key_path.write_text(json.dumps({
              "kaggle": {"accounts": [{
                  "name": "account_06",
                  "token": os.environ["KAGGLE_API_TOKEN_ACCOUNT_06"],
                  "enabled": True,
              }]},
              "wandb": {
                  "api_key": os.environ["WANDB_API_KEY"],
                  "entity": os.environ["WANDB_ENTITY"],
                  "project": os.environ["WANDB_PROJECT"],
              },
              "huggingface": {
                  "token": os.environ["HF_TOKEN"],
                  "repo_id": os.environ["HF_REPO_ID"],
              },
          }))
          key_path.chmod(0o600)
          try:
              from uav_network.cloud.cli import main
              from uav_network.cloud.client import resolve_username
              from uav_network.cloud.credentials import load_credentials

              credentials = load_credentials(key_path)
              username = resolve_username(credentials.accounts[0])
              result = main([
                  '--key-file', str(key_path),
                  'launch',
                  '--stage', 'train',
                  '--account', 'account_06',
                  '--credential-dataset', f'{username}/uav-cpu-wandb-credential',
                  '--algorithm', 'masac',
                  '--config', 'configs/comparison-20k-hybrid75-1kb-shared-actor-critic-xyz-sensing.yaml',
                  '--auto-continue',
                  '--gpus-per-run', '2',
                  '--accelerator', 'NvidiaTeslaT4',
                  '--timeout-seconds', '39600',
                  '--set', 'runtime.seed=44',
                  '--set', 'runtime.episodes=20000',
                  '--set', 'runtime.compile_models=false',
                  '--set', 'pql.enabled=true',
                  '--set', 'tracking.group=uav-xyz-cbf1500-0ac776b-masac-pql-s44',
              ])
              output = Path('outputs/masac-pql-replicate-launch.json')
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_text(json.dumps(result, indent=2))
              print(json.dumps({
                  "account": result["account"],
                  "commit": result["commit"],
                  "kernel_ref": result["kernel_ref"],
                  "run_id": result["runs"]["masac"]["id"],
                  "wandb_url": result["wandb_urls"]["masac"],
              }, indent=2))
          finally:
              key_path.unlink(missing_ok=True)
          PY

      - name: Preserve sanitized launch manifest
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: masac-pql-replicate-launch
          path: outputs/masac-pql-replicate-launch.json
          if-no-files-found: error
          retention-days: 14
