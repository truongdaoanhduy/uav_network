# GPU-resident off-policy training preset for the 35-target/25-obstacle mission.
# 512 parallel envs keep collection highly parallel without overwhelming the learner.
# 16 learner updates per vector step with batch=envs=512 gives 16 replay-sample
# usages per newly collected transition. This is an aggressive high-reuse setting
# chosen for the requested long run; it remains MASAC/MATD3, not the PQL algorithm.
# SAC/TD3 algorithmic internals (gamma/tau/policy_delay/noise) remain unchanged.
# Use --cpu-visualize in the Kaggle launcher for a separate CPU-only session.
world:
  num_targets: 35
  num_obstacles: 25
  max_steps: 1000
  motion_safety: dynamic_window
network:
  propagation_delay_enabled: true
  receiver_admission_mask: true
masac:
  hidden_sizes: [256, 256]
  replay_capacity: 500000
  batch_size: 512
  learning_starts: 16384  # 32 vector steps at 512 envs
  updates_per_step: 16
matd3:
  hidden_sizes: [256, 256]
  replay_capacity: 500000
  batch_size: 512
  learning_starts: 16384  # 32 vector steps at 512 envs
  updates_per_step: 16
runtime:
  environment_backend: warp_packet
  seed: 44
  eval_seed: 10044
  eval_episodes: 1
  num_envs: 512
  coalesce_idle_polls: true
  vectorize_critics: true
  compile_models: false
  fused_optimizers: false
  episodes: 4096
  device: cuda
  replay_device: cuda
  torch_threads: 1
  log_interval_steps: 51200  # 100 vector steps
  checkpoint_interval: 128
  max_train_seconds: 36000
  output_dir: outputs/motion-gpu-t35-o25
tracking:
  evaluation_interval: 0
  enabled: true
  entity: auto
  project: auto
  group: uav-network-gpu-packet-t35-o25
  tags: [uav-network, 2d, fov, warp-packet, kaggle, vectorized-critics, gpu-env, env512, targets35, obstacles25, high-reuse-u16]
