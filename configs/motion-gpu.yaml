# GPU-resident off-policy training preset for the 25-target/15-obstacle mission.
# 512 parallel envs keep collection highly parallel without overwhelming the learner.
# The 8 learner updates per vector step follow the collector:critic ratio used as a
# strong starting point in massively-parallel off-policy PQL-style training.
# SAC/TD3 algorithmic internals (gamma/tau/policy_delay/noise) remain unchanged.
# Use --cpu-visualize in the Kaggle launcher for a separate CPU-only session.
world:
  num_targets: 25
  num_obstacles: 15
  max_steps: 1000
  motion_safety: dynamic_window
network:
  receiver_admission_mask: true
masac:
  hidden_sizes: [256, 256]
  replay_capacity: 200000
  batch_size: 512
  learning_starts: 16384  # 32 vector steps at 512 envs
  updates_per_step: 8
matd3:
  hidden_sizes: [256, 256]
  replay_capacity: 200000
  batch_size: 512
  learning_starts: 16384  # 32 vector steps at 512 envs
  updates_per_step: 8
runtime:
  environment_backend: warp_packet
  seed: 44
  eval_seed: 10044
  eval_episodes: 1
  num_envs: 512
  coalesce_idle_polls: true
  vectorize_critics: true
  compile_models: false
  fused_optimizers: false
  episodes: 1024
  device: cuda
  replay_device: cuda
  torch_threads: 1
  log_interval_steps: 51200  # 100 vector steps
  checkpoint_interval: 128
  max_train_seconds: 36000
  output_dir: outputs/motion-gpu
tracking:
  evaluation_interval: 0
  enabled: true
  entity: auto
  project: auto
  group: uav-network-gpu-packet
  tags: [uav-network, 2d, fov, warp-packet, kaggle, vectorized-critics, gpu-env, env512, targets25, obstacles15, pql-style-updates]
