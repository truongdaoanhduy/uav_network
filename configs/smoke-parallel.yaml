# Real-network wiring, learner updates and masked resets; not convergence.
world:
  num_uavs: 6
  num_targets: 3
  num_obstacles: 2
  max_steps: 40
network:
  enabled: true
masac:
  hidden_sizes: [32, 32]
  replay_capacity: 512
  batch_size: 8
  learning_starts: 8
matd3:
  hidden_sizes: [32, 32]
  replay_capacity: 512
  batch_size: 8
  learning_starts: 8
runtime:
  algorithm: masac
  seed: 44
  num_envs: 2
  episodes: 4
  eval_episodes: 1
  device: cpu
  log_interval_steps: 20
  output_dir: outputs/smoke-parallel
