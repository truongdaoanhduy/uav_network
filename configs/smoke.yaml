# A wiring/finite-gradient check, not a convergence experiment.
world:
  num_uavs: 6
  num_targets: 3
  num_obstacles: 2
  max_steps: 40
network:
  enabled: true
masac:
  hidden_sizes: [32, 32]
  replay_capacity: 256
  batch_size: 8
  learning_starts: 8
matd3:
  hidden_sizes: [32, 32]
  replay_capacity: 256
  batch_size: 8
  learning_starts: 8
runtime:
  algorithm: masac
  num_envs: 1
  seed: 44
  episodes: 2
  eval_episodes: 1
  device: cpu
  output_dir: outputs/smoke
