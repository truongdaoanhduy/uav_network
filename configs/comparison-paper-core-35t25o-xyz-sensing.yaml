# PAPER-CORE (source-aligned CTDE hybrid adaptation) — NOT author-code reproduction.
# MATD3 Ackermann 2019: one independent actor and twin centralized critic per UAV.
# Hybrid MASAC: one stochastic hybrid actor and independent twin critic per UAV.
# No parameter sharing, no Actor LayerNorm, no PQL and no experimental action
# normalization/epsilon schedules. Strictly retain the UAV action-mask,
# learned RF power, scene/reward/CBF/net semantics from 35T25O seed44.
# This is NEW, UNTRAINED as a strict-U8/NoLN case; the 2026-11-07 W&B
# 10-run cohort does not include precisely this independent/U8/NoLN profile.
# Hidden 512/512, B8192, U8, seed44 are controlled project choices, not
# prescribed hyperparameters by SAC/MATD3 original papers.
# Never relabel the historical Shared + ActorLN results as this baseline.
world:
  generation_version: 3
  num_uavs: 6
  map_size_m: 1000.0
  num_targets: 35
  num_obstacles: 25
  max_steps: 1500
  motion_safety: cbf
  motion_dimensions: 3
  altitude_min_m: 0
  altitude_max_m: 150
  obstacle_height_min_m: 30
  obstacle_height_max_m: 120
network:
  propagation_delay_enabled: true
  receiver_admission_mask: true
  peer_range_m: 500.0
  gcs_range_m: 500.0
  tx_power_min_w: 0.001
  tx_power_max_w: 0.4
  tx_power_mapping: log
  power_control: learned
  link_budget_margin_db: 3.0
  pa_efficiency: 0.35
  tx_circuit_power_w: 0.1
  rx_circuit_power_w: 0.1
  power_limited_admission: true
  link_state_observation: true
  report_bytes: 1024
  payload_bytes: 1024
  buffer_bytes: 3072
  report_ttl_s: 300.0
  max_retries: 5
reward:
