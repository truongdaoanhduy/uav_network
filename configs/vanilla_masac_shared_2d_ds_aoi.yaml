# Vanilla MASAC Baseline (Canonical Haarnoja SAC v2 2018 / BenchMARL CTDE MASAC JMLR 2024)
# Scenario: 2.5D Fixed-Altitude Urban NLOS Cooperative Target Search & Multi-Hop Relay (Streamfix v3)
# Hardware Target: Kaggle Tesla T4x2 (SM 7.5, 14.56 GiB VRAM each) — 100% GPU-resident FP16 Replay Buffer

world:
  map_size_m: 800.0
  motion_dimensions: 2
  cruise_altitude_m: 50.0
  dt_s: 1.0
  max_steps: 550
  num_uavs: 6
  num_targets: 25
  num_obstacles: 22
  obstacle_radius_min_m: 25.0
  obstacle_radius_max_m: 45.0
  obstacle_height_min_m: 60.0
  obstacle_height_max_m: 120.0
  obstacle_clearance_m: 35.0
  gcs_position_m: [40.0, 40.0, 10.0]
  launch_radius_m: 100.0
  launch_min_spacing_m: 25.0
  target_exclusion_radius_m: 160.0
  max_speed_mps: 20.0
  max_accel_mps2: 4.0
  safety_distance_m: 15.0
  motion_safety: "project_penalize"

sensor:
  model: "dempster_shafer"
  belief_sharing_mode: "local_decpomdp"
  grid_cells_x: 20
  grid_cells_y: 20
  grid_cell_m: 40.0
  sensing_radius_m: 60.0
  obstacle_occlusion: true
  ds_mf_base: 0.55
  ds_me_base: 0.55
  confirm_mf_threshold: 0.90
  confirm_mu_ceiling: 0.15
  aoi_decay_eta: 0.02

network:
  enabled: true
  train_backend: "warp_slotted_fp32"
  eval_backend: "uavnetsim_full_csma"
  slotted_subslots: 4
  power_control: "fixed"
  tx_power_w: 0.1
  carrier_frequency_hz: 2400000000.0
  bandwidth_hz: 22000000.0
  bit_rate_bps: 2000000.0
  noise_density_dbm_hz: -174.0
  noise_figure_db: 7.0
  sinr_threshold_db: 6.0
  cca_threshold_dbm: -82.0
  path_loss_model: "log_distance_urban"
  los_exponent: 2.5
  nlos_extra_loss_db: 20.0
  nominal_comm_range_m: 480.0
  max_retries: 5
  report_bytes: 1024
  max_queue_reports: 32
  report_ttl_s: 120.0
  receiver_admission_mask: true
  visited_bitmask_loop_guard: true

energy:
  enabled: true
  model: "zeng_rotary_wing_2kg"
  battery_capacity_j: 150000.0
  p0_blade_profile_w: 80.0
  pi_induced_hover_w: 88.0
  u_tip_mps: 120.0
  v0_mean_rotor_mps: 4.03
  d0_fuselage_drag: 0.6
  rho_air: 1.225
  rotor_solidity: 0.05
  rotor_disc_area_m2: 0.503
  tx_circuit_power_w: 0.1
  rx_circuit_power_w: 0.1
  pa_efficiency: 0.35

reward:
  w1_global_ds_uncertainty: 0.25
  w2_gcs_aoi_delivery: 15.0
  w3_propulsion_per_kj: 0.03
  w4_safety_violation: 3.0
  w5_expired_or_dropped: 1.0
  per_hop_relay_reward: 0.0
  rf_efficiency_penalty: 0.0

masac:
  share_actor_parameters: true
  share_critic_parameters: true
  hidden_sizes: [256, 256]
  activation: "relu"
  actor_layer_norm: false
  critic_layer_norm: false
  log_std_min: -5.0
  log_std_max: 2.0
  learning_rate: 0.0003
  gamma: 0.99
  tau: 0.005
  initial_alpha_cont: 0.2
  initial_alpha_disc: 0.2
  target_entropy_cont: -2.0
  target_entropy_disc_ratio: 0.5
  gumbel_tau: 1.0
  batch_size: 1024
  replay_capacity: 1000000
  learning_starts: 20000
  updates_per_step: 8
  grad_clip_norm: 0.5

runtime:
  algorithm: "masac"
  device: "cuda:0"
  learner_device: "cuda:1"
  replay_device: "cuda:1"
  replay_obs_dtype: "float16"
  num_envs: 2048
  use_cuda_graph: true
  seed: 44
  total_env_steps: 20000000
  log_interval_steps: 20480
  eval_interval_steps: 1000000
  eval_episodes_slotted: 100
  eval_episodes_full_uavnetsim: 100
