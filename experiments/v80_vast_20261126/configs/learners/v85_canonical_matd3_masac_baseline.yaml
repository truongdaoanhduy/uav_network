# V85 Canonical Vanilla MATD3 & MASAC Baseline Configuration (NO custom modifications).
# Faithful to:
# - MATD3: Fujimoto et al. (ICML 2018) + Ackermann et al. (2019, arXiv:1910.01465)
# - MASAC: Haarnoja et al. (ICML 2018 / arXiv:1812.05905 SAC v2)
# - Clean action space: power_control=fixed, continuous_dim=2 (no redundant tx_power action).
# Pair with `--baseline-mode canonical_continuous --replay-action-mode raw` for pure 2D
# continuous baselines (with zero-oracle event-driven MAC), or `--baseline-mode hybrid` for
# canonical Hybrid-MATD3 / Hybrid-MASAC comparisons.
world:
  num_uavs: 6
network:
  power_control: fixed
  destination_mode: compact_3
runtime:
  num_envs: 64
  algorithm: matd3
  amp_mode: 'off'
motion_dim: 2
continuous_dim: 2
matd3:
  hidden_sizes: [256, 256]
  batch_size: 256
  replay_capacity: 65536
  learning_starts: 4096
  actor_layer_norm: false
  critic_layer_norm: false
  actor_batch_norm: false
  critic_batch_norm: false
  activation: relu
  pre_tanh_reg: 0.0
  actor_output_regularization: 0.0
  initialization: default
  critic_huber_delta: 0.0
  sync_critic_loss_scale: false
  policy_delay: 2
  target_noise_std: 0.2
  target_noise_clip: 0.5
  exploration_noise_std: 0.1
  gamma: 0.99
  tau: 0.005
  learning_rate: 0.0003
  grad_clip_norm: 0.0
masac:
  hidden_sizes: [256, 256]
  batch_size: 256
  replay_capacity: 65536
  learning_starts: 4096
  actor_layer_norm: false
  critic_layer_norm: false
  actor_batch_norm: false
  critic_batch_norm: false
  activation: relu
  critic_huber_delta: 0.0
  sync_critic_loss_scale: false
  initial_alpha: 0.2
  target_continuous_entropy: -2.0
  gamma: 0.99
  tau: 0.005
  learning_rate: 0.0003
  grad_clip_norm: 0.0
