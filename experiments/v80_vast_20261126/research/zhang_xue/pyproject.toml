[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhang-xue-seven-radio-scenario"
version = "0.73.0"
description = "Six UAV target search and 7-radio packet-network research scenario"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
gpu = ["warp-lang==1.18.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["zhang_xue*"]
